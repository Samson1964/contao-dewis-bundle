# Quelle fuer die Metadaten im Contao Manager (contao/package-metadata).
# Aenderungen hier werden von Claude in den Fork uebertragen.
# Der englische Block wird beim Abgleich ergaenzt, falls er fehlt.

de:
    title: DeWIS - DWZ-Abfrage Deutscher Schachbund
    description: >
        Fragt die Deutsche Wertungszahl (DWZ) über die DeWIS-Schnittstelle des Deutschen Schachbundes (DSB) ab und zeigt sie auf der DSB-Website an. Dieses Bundle wird nicht mehr gepflegt und war bis 25.07.2026 beim DSB im Einsatz.

        Es stehen Frontend-Module für Spieler, Vereine, Verbände, Turniere, die Spielersuche und Bestenlisten bereit.
    keywords:
        - Schach
        - DWZ
        - DeWIS
        - Wertungszahl
        - Spielersuche
    support:
        issues: https://github.com/Samson1964/contao-dewis-bundle/issues
        source: https://github.com/Samson1964/contao-dewis-bundle
    suggest:
        schachbulle/contao-wertungsportal-bundle: Der Nachfolger, der statt der SOAP-Schnittstelle die neuere REST-Schnittstelle des Wertungsportals nutzt

en:
    title: DeWIS - German chess rating lookup
    description: >
        Looks up the German chess rating (DWZ) via the DeWIS interface of the German Chess Federation (DSB) and displays it on the DSB website. This bundle is no longer maintained; it was in use at the DSB until 25 July 2026.

        Front end modules are available for players, clubs, federations, tournaments, player search and top lists.
    keywords:
        - chess
        - rating
        - DWZ
        - DeWIS
        - player search
    support:
        issues: https://github.com/Samson1964/contao-dewis-bundle/issues
        source: https://github.com/Samson1964/contao-dewis-bundle
    suggest:
        schachbulle/contao-wertungsportal-bundle: The successor, which uses the newer REST interface of the rating portal instead of SOAP
